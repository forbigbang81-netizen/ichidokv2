name: Auto-import new anime episodes

# Runs daily at 09:00 UTC (3am CST) to check for new episodes
# of airing anime on anigo.re. When new episodes are found, the
# archive is updated and a commit is pushed (which triggers the
# deploy workflow).

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 09:00 UTC
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  auto-import:
    name: Check for new episodes
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push commits
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run auto-import
        env:
          CI: "true"
        run: python3 scripts/auto_import.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/anime-archive.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/anime-archive.json
          git commit -m "auto-import: new episodes $(date -u +'%Y-%m-%d')"
          git push
